; Smart E-Bike — прошивка контроллера на ESP32-S3
; Фреймворк: Arduino (поверх ESP-IDF) + PlatformIO. Обоснование: docs/ARCHITECTURE.md, раздел «Выбор фреймворка».

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
lib_deps =
    fastled/FastLED @ ^3.7.0
lib_ldf_mode = chain

; Основная плата: ESP32-S3-DevKitC-1 (модуль ESP32-S3-WROOM-1 N16R8: 16 МБ flash, 8 МБ PSRAM)
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Сборка с реальным дисплеем: LVGL 8.3 + LovyanGFX (ILI9488 3.5" / ST7796S 4", 480×320 SPI)
[env:esp32s3_lvgl]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DUSE_LVGL
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl @ ~8.3.11
    lovyan03/LovyanGFX @ ^1.1.16

; Обновление по Wi‑Fi (ArduinoOTA). IP/хост задаётся при прошивке: pio run -e esp32s3_ota -t upload --upload-port <ip>
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota

; Тесты чистой логики на ПК (без Arduino): pio test -e native
[env:native]
platform = native
framework =
lib_deps =
lib_compat_mode = off
lib_ignore = core, led_common, battery_meter, underglow, rear_light, front_turn, auto_light, buttons, display, power, grips
build_flags = -std=gnu++17
build_unflags =
test_build_src = no
